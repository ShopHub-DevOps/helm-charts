# Pull secrets for private registries. The ShopHub images live in private
# GHCR packages, so a docker-registry Secret must exist in the release
# namespace and be listed here, e.g.:
#   imagePullSecrets:
#     - name: ghcr-pull
imagePullSecrets: []

# Default values for the shop-operator chart.
# Real configuration lands with the chart's feature epic.
# Operator image
image:
  repository: ghcr.io/shophub-devops/shop-operator
  tag: "0.1.0"
  pullPolicy: IfNotPresent

# Operator deployment
replicas: 1
namespace: shop-operator-system

# Resources
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Logging
logLevel: info

# Service for metrics
service:
  type: ClusterIP
  port: 8080
  metricsPort: 8081
