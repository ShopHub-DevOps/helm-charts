apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "shop-operator.fullname" . }}
  labels:
    {{- include "shop-operator.labels" . | nindent 4 }}
rules:
# Shops
- apiGroups: ["shophub.io"]
  resources: ["shops"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["shophub.io"]
  resources: ["shops/status"]
  verbs: ["get", "patch", "update"]
# DiscordChannels
- apiGroups: ["shophub.io"]
  resources: ["discordchannels"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["shophub.io"]
  resources: ["discordchannels/status"]
  verbs: ["get", "patch", "update"]
# Wallets
- apiGroups: ["shophub.io"]
  resources: ["wallets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["shophub.io"]
  resources: ["wallets/status"]
  verbs: ["get", "patch", "update"]
# Leader election (leases, events) is granted by the namespaced Role in
# leader-election-role.yaml, mirroring kubebuilder's own layout - the lease
# lives only in the operator's namespace, so it needs no cluster-wide grant.
# Core K8s resources
# The operator seeds a per-Shop Secret (JWT, DB placeholder) in addition to
# reading the shared one, so it needs write verbs here - not just read.
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# Database tiers provisioned per Shop:
#   databaseTier: standard -> CNPG Cluster
#   databaseTier: light    -> Redis Enterprise database
- apiGroups: ["postgresql.cnpg.io"]
  resources: ["clusters"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["app.redislabs.com"]
  resources: ["redisenterprisedatabases"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# Per-Shop monitoring (ServiceMonitor + PrometheusRule) and the Discord alert
# routing generated from a DiscordChannel CR (AlertmanagerConfig).
- apiGroups: ["monitoring.coreos.com"]
  resources: ["servicemonitors", "prometheusrules", "alertmanagerconfigs"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]