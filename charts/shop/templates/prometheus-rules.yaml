apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "shop.fullname" . }}-tenant-rules
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shop.labels" . | nindent 4 }}
    release: shophub
spec:
  groups:
  - name: {{ include "shop.fullname" . }}.rules
    rules:
    - alert: HighErrorRate
      expr: sum(rate(shop_http_requests_total{status_code=~"5..", pod=~"{{ include "shop.fullname" . }}-.*"}[5m])) / sum(rate(shop_http_requests_total{pod=~"{{ include "shop.fullname" . }}-.*"}[5m])) > {{ default 0.05 .Values.alerting.errorRateThreshold }}
      for: 5m
      labels:
        severity: critical
        tenant: {{ .Release.Name }}
      annotations:
        summary: "Tenant {{ .Release.Name }} has a high error rate"
        description: "Error rate for tenant {{ .Release.Name }} has exceeded the threshold."

    - alert: HighLatency
      expr: histogram_quantile(0.95, sum(rate(shop_http_request_duration_seconds_bucket{pod=~"{{ include "shop.fullname" . }}-.*"}[5m])) by (le)) > {{ default 2.0 .Values.alerting.latencyThreshold }}
      for: 5m
      labels:
        severity: warning
        tenant: {{ .Release.Name }}
      annotations:
        summary: "Tenant {{ .Release.Name }} is experiencing high latency"
        description: "95th percentile latency for tenant {{ .Release.Name }} is above {{ default 2.0 .Values.alerting.latencyThreshold }}s."

    - alert: Frequent4xx
      expr: sum(rate(shop_http_requests_total{status_code=~"4..", pod=~"{{ include "shop.fullname" . }}-.*"}[5m])) by (route) > {{ default 10 .Values.alerting.frequent4xxThreshold }}
      for: 5m
      labels:
        severity: warning
        tenant: {{ .Release.Name }}
      annotations:
        summary: "Frequent 4xx errors on {{ "{{ $labels.route }}" }} for {{ .Release.Name }}"
        description: "Route {{ "{{ $labels.route }}" }} for tenant {{ .Release.Name }} is experiencing a high rate of 4xx errors."

    - alert: TenantResourceSaturation
      expr: sum by (pod) (container_memory_usage_bytes{pod=~"{{ include "shop.fullname" . }}-.*", container!="POD"}) / sum by (pod) (kube_pod_container_resource_limits{resource="memory", pod=~"{{ include "shop.fullname" . }}-.*"}) > 0.85
      for: 5m
      labels:
        severity: warning
        tenant: {{ .Release.Name }}
      annotations:
        summary: "Pod {{ "{{ $labels.pod }}" }} Memory saturation"
        description: "Pod {{ "{{ $labels.pod }}" }} for tenant {{ .Release.Name }} is approaching its memory limit."
