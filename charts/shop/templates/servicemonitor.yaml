apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "shop.fullname" . }}-backend
  labels:
    {{- include "shop.labels" . | nindent 4 }}
    release: shophub
spec:
  selector:
    matchLabels:
      {{- include "shop.selectorLabels" . | nindent 6 }}
      # Must match the label backend-service.yaml actually sets. It is the
      # unprefixed `component`, not `app.kubernetes.io/component` - with the
      # prefixed key this selector matched nothing and the backend was never
      # scraped.
      component: backend
  endpoints:
    - port: http
      path: /metrics
  podTargetLabels:
    - shophub.io/host
