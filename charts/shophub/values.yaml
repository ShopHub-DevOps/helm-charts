# Pull secrets for private registries. The ShopHub images live in private
# GHCR packages, so a docker-registry Secret must exist in the release
# namespace and be listed here, e.g.:
#   imagePullSecrets:
#     - name: ghcr-pull
imagePullSecrets: []

# Default values for the shophub chart.
# Real configuration lands with the chart's feature epic.

# Backend image
backendImage: ghcr.io/shophub-devops/shophub-backend
backendTag: "1.0.0"
backendPort: 3000

# Frontend image
frontendImage: ghcr.io/shophub-devops/shophub-frontend
frontendTag: "1.0.0"
frontendPort: 3000

# Deployment
replicas: 1

# Ingress hostname
ingressHostname: "shophub.local"

# Database connection secret
databaseSecretName: "shophub-postgres-secret"
databaseSecretKey: "url"

# JWT secret
jwtSecret: "change-me-in-production-with-32-char-random-string"

# SIWE (Sign-In With Ethereum)
siweConfig:
  domain: "shophub.local"
  origin: "http://shophub.local"

# Resources
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Environment
env:
  NODE_ENV: production
  LOG_LEVEL: info

# Grafana Admin Password
# CHANGE IN PRODUCTION via --set grafanaAdminPassword=YOUR_SECURE_PASSWORD
grafanaAdminPassword: "ShopHub-Admin-2026!"

# GitHub OAuth Setup
# CHANGE IN PRODUCTION via --set githubOAuth.clientId=xxx --set githubOAuth.clientSecret=xxx
githubOAuth:
  clientId: ""
  clientSecret: ""

# Kube Prometheus Stack Dependency Overrides
kube-prometheus-stack:
  # Default true so a standalone `helm install shophub` still brings up its own
  # observability stack. Set to false when the cluster already has a shared
  # kube-prometheus-stack release (see the note on the dependency in Chart.yaml).
  enabled: true
  grafana:
    admin:
      existingSecret: "shophub-grafana-auth"
      userKey: admin-user
      passwordKey: admin-password
    envValueFrom:
      GF_AUTH_GITHUB_CLIENT_ID:
        secretKeyRef:
          name: shophub-grafana-auth
          key: github-client-id
      GF_AUTH_GITHUB_CLIENT_SECRET:
        secretKeyRef:
          name: shophub-grafana-auth
          key: github-client-secret
    grafana.ini:
      server:
        root_url: "http://grafana.shophub.local"
      auth.anonymous:
        enabled: false
      auth.github:
        enabled: true
        allow_sign_up: true
        scopes: "user:email,read:org"
        auth_url: "https://github.com/login/oauth/authorize"
        token_url: "https://github.com/login/oauth/access_token"
        api_url: "https://api.github.com/user"
        allowed_organizations: "ShopHub-DevOps"
    ingress:
      enabled: true
      ingressClassName: nginx
      hosts:
        - grafana.shophub.local
    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: "1"

alerting:
  discordWebhookUrl: "https://discord.com/api/webhooks/dummy/dummy"
