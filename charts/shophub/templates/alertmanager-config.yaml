apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: {{ include "shophub.fullname" . }}-discord-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shophub.labels" . | nindent 4 }}
    release: {{ .Release.Name }}
spec:
  route:
    receiver: 'discord'
    groupBy: ['alertname', 'job']
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 12h
  receivers:
  - name: 'discord'
    discordConfigs:
    - apiURL:
        key: webhook-url
        name: {{ include "shophub.fullname" . }}-discord-secret
