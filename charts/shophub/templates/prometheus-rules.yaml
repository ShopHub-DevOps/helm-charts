apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "shophub.fullname" . }}-cluster-rules
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shophub.labels" . | nindent 4 }}
    release: {{ .Release.Name }}
spec:
  groups:
  - name: shophub-cluster.rules
    rules:
    - alert: MissingScrapeTargets
      expr: up == 0
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "Target {{ "{{ $labels.job }}" }} is down"
        description: "Scrape target {{ "{{ $labels.instance }}" }} has been down for more than 5 minutes."

    - alert: PodRestartLoops
      expr: rate(kube_pod_container_status_restarts_total[10m]) > 0
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "Pod {{ "{{ $labels.pod }}" }} is crash looping"
        description: "Pod {{ "{{ $labels.pod }}" }} in namespace {{ "{{ $labels.namespace }}" }} has restarted within the last 10 minutes."

    - alert: NodeCpuSaturation
      expr: 1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) > 0.85
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Node {{ "{{ $labels.instance }}" }} CPU saturation"
        description: "Node {{ "{{ $labels.instance }}" }} CPU usage has exceeded 85% for 5 minutes."

    - alert: NodeMemorySaturation
      expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes > 0.85
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Node {{ "{{ $labels.instance }}" }} Memory saturation"
        description: "Node {{ "{{ $labels.instance }}" }} memory usage has exceeded 85% for 5 minutes."
